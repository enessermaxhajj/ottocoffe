apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: ottocoffee

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: enessermaxhaj/enescoffe-backend:1.1
          ports:
            - containerPort: 3000
    
