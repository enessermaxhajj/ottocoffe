name: Otto Coffee CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      # 1. Merr kodin nga GitHub
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Login në Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # 3. Build backend
      - name: Build backend image
        run: |
          docker build \
            -t ${{ vars.DOCKER_USERNAME }}/otto-coffee-backend:1.0 \
            ./backend


      # 4. Build frontend
      - name: Build frontend image
        run: |
          docker build \
            -t ${{ vars.DOCKER_USERNAME }}/otto-coffee-frontend:1.0 \
            ./frontend


      # 5. Push backend në Docker Hub
      - name: Push backend image
        run: |
          docker push \
            ${{ vars.DOCKER_USERNAME }}/otto-coffee-backend:1.0


      # 6. Push frontend në Docker Hub
      - name: Push frontend image
        run: |
          docker push \
            ${{ vars.DOCKER_USERNAME }}/otto-coffee-frontend:1.0