name: Otto Coffee CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build backend image
        run: |
          docker build \
            -t ${{ vars.DOCKER_USERNAME }}/otto-coffee-backend:1.0 \
            ./backend


      - name: Build frontend image
        run: |
          docker build \
            -t ${{ vars.DOCKER_USERNAME }}/otto-coffee-frontend:1.0 \
            ./frontend


      - name: Push backend image
        run: |
          docker push \
            ${{ vars.DOCKER_USERNAME }}/otto-coffee-backend:1.0


      - name: Push frontend image
        run: |
          docker push \
            ${{ vars.DOCKER_USERNAME }}/otto-coffee-frontend:1.0