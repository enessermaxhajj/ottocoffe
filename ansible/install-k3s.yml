- name: Install K3s
  hosts: servers
  become: yes

  tasks:

    - name: Download and install K3s
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Enable K3s
      systemd:
        name: k3s
        enabled: yes
        state: started

    - name: Check K3s
      command: k3s --version
      register: k3s_version

    - name: Show K3s version
      debug:
        var: k3s_version.stdout
